name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build Chrome
        run: npm run build

      - name: Build Firefox (post-process)
        run: node scripts/build-firefox.mjs

      - name: Pack Chrome zip
        run: |
          NAME="tabvault-chrome-${GITHUB_REF_NAME}"
          cp -r dist "$NAME"
          zip -r "${NAME}.zip" "$NAME"
          echo "CHROME_ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Pack Firefox zip
        run: |
          NAME="tabvault-firefox-${GITHUB_REF_NAME}"
          cp -r dist-firefox "$NAME"
          zip -r "${NAME}.zip" "$NAME"
          echo "FIREFOX_ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.CHROME_ZIP }}
            ${{ env.FIREFOX_ZIP }}
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            ## Установка

            ### Chrome / Edge / Brave / Opera / Vivaldi
            1. Скачай `${{ env.CHROME_ZIP }}` ниже
            2. Распакуй
            3. `chrome://extensions` → включи **Developer mode** → **Load unpacked** → выбери распакованную папку

            ### Firefox (128+)
            1. Скачай `${{ env.FIREFOX_ZIP }}` ниже
            2. Распакуй
            3. `about:debugging#/runtime/this-firefox` → **Load Temporary Add-on…** → выбери `manifest.json` внутри распакованной папки

            > Firefox 128+ требует включить в `about:config` параметр `extensions.manifestV3.enabled = true`, если ещё не включён по умолчанию.
